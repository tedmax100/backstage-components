apiVersion: v1
kind: ConfigMap
metadata:
  name: logistics-prod-html
  namespace: logistics-prod
  labels:
    app: logistics-prod
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>logistics-prod</title>
      <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        .container { background: white; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        h1 { color: #333; }
      </style>
    </head>
    <body>
      <div class="container">
        <h1>logistics-prod</h1>
        <p>Production logistics application</p>
        <p><strong>Namespace:</strong> logistics-prod</p>
        <p><strong>Owner:</strong> user:guest</p>
      </div>
    </body>
    </html>
