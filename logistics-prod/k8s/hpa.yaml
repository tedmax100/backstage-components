apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logistics-prod-hpa
  namespace: logistics-prod
  labels:
    app: logistics-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logistics-prod
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
