apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-demo-html
  namespace: payments-demo
  labels:
    app: payments-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>payments-demo</title>
      <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        .container { background: white; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        h1 { color: #333; }
      </style>
    </head>
    <body>
      <div class="container">
        <h1>payments-demo</h1>
        <p>Payments demo application</p>
        <p><strong>Namespace:</strong> payments-demo</p>
        <p><strong>Owner:</strong> user:guest</p>
      </div>
    </body>
    </html>
