apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payments-demo-hpa
  namespace: payments-demo
  labels:
    app: payments-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payments-demo
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
